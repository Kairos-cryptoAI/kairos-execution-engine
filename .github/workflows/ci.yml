name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Python 3.11
            os: ubuntu-latest
            python-version: "3.11"
          - name: Linux / Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
          - name: Windows / Python 3.11
            os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 22 for sidecar client tests
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy kairos_execution
      - name: Security scan
        run: uv run --locked bandit -q -r kairos_execution -x tests
      - name: Test
        run: uv run --locked pytest -q -m "not integration" --tb=short
      - name: Build source and wheel distributions
        run: uv build --no-sources

  evedex-sidecar:
    name: EVEDEX sidecar / Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairos_execution/evedex_sidecar
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kairos_execution/evedex_sidecar/package-lock.json
      - name: Install pinned production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Test protocol and pinned SDK assumptions
        run: npm test
      - name: Audit production dependency tree
        run: npm audit --omit=dev

  optional-adapters:
    name: All exchange adapters
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 22 for sidecar client tests
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync all locked extras
        run: uv sync --locked --all-extras
      - name: Import optional adapter dependencies
        run: uv run --locked --all-extras python -c "import ccxt.async_support; import eth_account"
      - name: Test with all extras
        run: uv run --locked --all-extras pytest -q -m "not integration" --tb=short

  execution-journal-integration:
    name: Execution journal / TimescaleDB
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos_test
          POSTGRES_DB: kairos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KAIROS_PERSISTENCE_DATABASE_URL: postgresql://kairos:kairos_test@localhost:5432/kairos
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --python 3.11 --locked --dev --extra evedex
      - run: uv run --python 3.11 --locked --dev --extra evedex pytest -q -m integration
