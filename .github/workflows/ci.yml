name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Python 3.11
            os: ubuntu-latest
            python-version: "3.11"
          - name: Linux / Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
          - name: Windows / Python 3.11
            os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy kairos_execution
      - name: Security scan
        run: uv run --locked bandit -q -r kairos_execution -x tests
      - name: Test
        run: uv run --locked pytest -q --tb=short
      - name: Build source and wheel distributions
        run: uv build --no-sources

  optional-adapters:
    name: All exchange adapters
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync all locked extras
        run: uv sync --locked --all-extras
      - name: Import optional adapter dependencies
        run: uv run --locked --all-extras python -c "import ccxt.async_support; import eth_account"
      - name: Test with all extras
        run: uv run --locked --all-extras pytest -q --tb=short
