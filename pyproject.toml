[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-execution-engine"
version = "0.1.0"
description = "Kairos Layer 6 — atomic order execution with EVEDEX (EIP-712) and CCXT adapters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "kairos-persistence>=0.1,<0.2",
    "aiohttp>=3.9,<4",
    "redis>=6.4,<9",
    "structlog>=24.1,<27",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
evedex = ["eth-account>=0.11,<1"]
ccxt = ["ccxt>=4.3,<5"]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[project.scripts]
kairos-execution-engine = "kairos_execution.service:main"
kairos-evedex-qualify = "kairos_execution.qualification:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_execution"]

[tool.hatch.build.targets.sdist]
include = [
    "/kairos_execution",
    "/tests",
    "/.env.example",
    "/.python-version",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build]
exclude = [
    "/sidecar",
    "/kairos_execution/evedex_sidecar/node_modules",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "0c8717c18d535465ae89c51bcd958b0884ec02ab" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "cf95a5e73817ec01c77c8e7471a4fc8ae64ff2dd" }

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "eth_account", "eth_account.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real TimescaleDB instance"]
