[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-execution-engine"
version = "0.1.0"
description = "Kairos Layer 6 — atomic order execution with EVEDEX (EIP-712) and CCXT adapters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "kairos-persistence>=0.1,<0.2",
    "kairos-risk-manager>=0.2,<0.3",
    "aiohttp>=3.14.4,<4",
    # GHSA-54p9-h82j-f925: exclude the vulnerable aiohttp transitive versions.
    "multidict>=6.9.1,<7",
    "redis>=6.4,<9",
    "structlog>=24.1,<27",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
evedex = ["eth-account>=0.11,<1", "coincurve==21.0.0"]
ccxt = ["ccxt>=4.3,<5", "urllib3>=2.8.0,<3", "certifi>=2026.10.19"]
production-evidence = ["cryptography==50.0.0"]
recorder = ["kairos-quant-scouts>=0.1,<0.2"]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "cryptography==50.0.0",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[project.scripts]
kairos-execution-engine = "kairos_execution.service:main"
kairos-evedex-qualify = "kairos_execution.qualification:main"
kairos-evedex-record-readonly = "kairos_execution.readonly_recorder_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_execution"]

[tool.hatch.build.targets.sdist]
include = [
    "/kairos_execution",
    "/tests",
    "/.env.example",
    "/.python-version",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build]
exclude = [
    "/sidecar",
    "/kairos_execution/evedex_sidecar/node_modules",
]

[tool.uv]
required-version = "==0.12.3"
override-dependencies = [
    "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@ff3af7592cbd47be985d794d8d9903aaa8e5df07",
    "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@506628fc8686ff7373d72f37ac032e53a47b233f",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "ff3af7592cbd47be985d794d8d9903aaa8e5df07" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "506628fc8686ff7373d72f37ac032e53a47b233f" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "c37f6d7be446b2a906b9cba80ea31da4d12dbae3" }
kairos-quant-scouts = { git = "https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git", rev = "0a7c3b69bf2b2e55ab23d5c23da8ca884c06b301" }

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "eth_account", "eth_account.*", "coincurve", "coincurve.*", "eth_utils", "eth_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real TimescaleDB instance"]
